org.gradle.jvmargs=-Xmx2048M

minecraft_version=1.20.1
enabled_platforms=quilt,fabric,forge

archives_base_name=HariShop-mc1.20.1
# Forge's TOML version parser accepts Maven-like numeric versions but rejects
# the legacy leading `v`; keep the user-facing archive name unchanged while
# emitting a valid mod metadata version.
mod_version=1.2.0-forge-backport
maven_group=hari

architectury_version=9.2.14

fabric_loader_version=0.14.23
fabric_api_version=0.90.4+1.20.1

# Match the user's Forge 1.20.1 profile.  Keeping the exact loader patch
# version here prevents a reobfuscated dependency (Numismatic/ProClaim) from
# being tested against a different runtime ABI.
forge_version=1.20.1-47.4.10

quilt_loader_version=0.21.2-beta.2
quilt_fabric_api_version=7.4.0+0.90.0-1.20.1
